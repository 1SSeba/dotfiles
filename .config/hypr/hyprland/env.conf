# ############ Wayland #############
env = ELECTRON_OZONE_PLATFORM_HINT,auto

######### Applications #########
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# ############ Themes #############
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, kde
env = XDG_MENU_PREFIX, plasma-

# ######## Virtual envrionment #########
env = ILLOGICAL_IMPULSE_VIRTUAL_ENV, ~/.local/state/quickshell/.venv

# ######## QtWebEngine adentro de quickshell #########
# Shim que hace posible embeber WebEngineView en la shell (las webapps de la
# pestana Social del sidebar). Va como env de sesion y no solo en la linea que
# lanza qs, porque la shell se relanza por varios caminos (Ctrl+Super+R, un
# `qs -c ii` a mano en una terminal, scripts) y sin LD_PRELOAD Social cae al
# modo "boton Abrir".
#
# Ponerlo global es seguro a proposito: el shim son 16 KB, no linkea Qt, y su
# constructor lo primero que hace es mirar si el programa se llama quickshell/qs
# y salir si no. Cualquier otro proceso de la sesion solo lo mapea y sigue.
# Ver ~/.local/lib/qs-webengine-shim/.
env = LD_PRELOAD,/home/scruzd/.local/lib/qs-webengine-shim/libqs-webengine-shim.so
