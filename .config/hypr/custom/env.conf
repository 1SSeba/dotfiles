# env personalizado. Vacío a propósito: hyprland.conf lo hace source
# y Hyprland marca error si el archivo no existe.

# ######## NVIDIA + Wayland (fix render glitches en apps Chromium/Electron) #########
# Sin esto, Chromium/Electron caen a XWayland y con el driver propietario de
# NVIDIA producen buffers que no se redibujan bien (ventanas "transparentes"
# mostrando lo que hay detrás). GBM_BACKEND habilita el backend nativo de
# NVIDIA para GBM, las otras dos apuntan GLX/EGL al driver correcto.
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
