# Este archivo lo sourcea hyprland.conf DESPUES de hyprland/variables.conf,
# asi que lo de aca pisa a lo de upstream sin tocar sus archivos.

# El $terminal de upstream es `kitty -1`, que con varias sesiones de Hyprland
# abiertas abre la ventana en la sesion equivocada. Ver el comentario del script.
$terminal = ~/.config/hypr/custom/scripts/launch_terminal.sh
