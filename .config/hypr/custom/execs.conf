# El bloqueo al arrancar NO se hace desde aca.
#
# Lo maneja la propia shell: `lock.launchOnStartup` en
# ~/.config/illogical-impulse/config.json, que dispara el lockscreen QML
# (modules/common/panels/lock/LockScreen.qml) cuando Persistent detecta una
# instancia nueva de Hyprland. Por eso no se re-bloquea al recargar la shell.
#
# Aca hubo un `exec-once = hyprlock --grace 0`: se adelantaba a la shell y
# tapaba el lockscreen propio con el de hyprlock. Si algun dia lo queres de
# vuelta, la opcion prolija es `lock.useHyprlock: true` en el config.json,
# que hace que la shell llame a hyprlock en vez de a su lock QML.
